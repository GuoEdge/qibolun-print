*{box-sizing:border-box}body{margin:0;background:#d9d1c3;color:var(--ink);font-family:var(--ui-font);font-size:13px}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:60px 1fr}.topbar{background:var(--indigo-deep);color:#f6f0e5;display:flex;align-items:center;gap:22px;padding:0 24px;letter-spacing:.04em}.brand{font-family:var(--heading-font);font-size:21px;letter-spacing:.18em;white-space:nowrap}.brand small{display:block;font-family:var(--ui-font);font-size:10px;letter-spacing:.12em;color:#c9b99f;margin-top:2px}.top-tabs{display:flex;gap:4px;height:100%}.tab{border:0;background:transparent;color:#cad4d7;padding:0 18px;border-bottom:3px solid transparent}.tab.active{color:#fff3dd;border-bottom-color:var(--ochre)}.top-actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid rgba(255,255,255,.26);background:transparent;color:#f6f0e5;padding:8px 12px;border-radius:3px}.btn.primary{background:var(--cinnabar);border-color:var(--cinnabar)}.workspace{display:grid;grid-template-columns:270px minmax(480px,1fr) 360px;min-height:calc(100vh - 60px);overflow:hidden}.sidebar,.inspector{background:var(--panel);padding:20px;overflow:auto}.sidebar{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.section-title{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}.block{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}.field{margin:11px 0}.field label{display:flex;justify-content:space-between;align-items:center;color:#5c4d3c;margin-bottom:5px;gap:8px}.field output{color:var(--cinnabar);font-variant-numeric:tabular-nums;white-space:nowrap}.field input[type=range]{width:100%;accent-color:var(--cinnabar)}.field select,.field input[type=text],.field input[type=number]{width:100%;background:#faf6ed;border:1px solid var(--line);padding:7px;color:var(--ink);border-radius:3px}.field input[type=color]{width:100%;height:32px;b 0}.folio{position:absolute;top:25px;left:var(--margin-inner);right:var(--margin-outer);display:flex;justify-content:space-between;font-family:var(--ui-font);font-size:10px;letter-spacing:.08em;color:var(--muted)}.article-title{font-family:var(--heading-font);font-size:var(--title-size);line-height:1.35;font-weight:500;letter-spacing:.06em;border-bottom:1px solid var(--line);padding-bottom:13px;margin:0 0 5px;text-align:var(--title-align,left)}.article-date{font-family:var(--ui-font);font-size:11px;color:var(--muted);margin-bottom:36px}.label{font-family:var(--ui-font);font-size:11px;letter-spacing:.12em;color:var(--cinnabar);margin:22px 0 8px}.question{font-size:var(--question-size);line-height:1.7;padding:10px 14px;border-left:3px solid var(--ochre);background:rgba(183,138,75,.08);margin-bottom:28px}.question.plain{border-left:0;background:transparent;padding-left:0}.question.frame{border:1px solid var(--line);border-left:3px solid var(--cinnabar);background:#fbf6eb}.article-body{font-size:var(--body-size)}.article-body p{margin:0 0 var(--para-gap);text-indent:var(--para-indent)}.article-body p:first-child{ text-indent:0}.images{margin:30px 0}.images figure{margin:var(--image-gap) 0;text-align:center}.images img{max-width:var(--image-width);max-height:460px;border:var(--image-border,1px) solid #d8cab3}.images figcaption{font-family:var(--ui-font);font-size:10px;color:var(--muted);margin-top:4px}.research-meta{border-top:1px solid var(--line);margin-top:38px;padding-top:10px;font-family:var(--ui-font);font-size:var(--meta-size);line-height:1.7;color:var(--muted);display:var(--meta-display,block)}.notes{margin-top:28px;padding:13px 14px 10px;background:rgba(183,138,75,.08);border:1px solid rgba(183,138,75,.3);font-family:var(--ui-font);font-size:10px;color:var(--muted);display:var(--notes-display,block)}.notes .note-line{height:27px;border-bottom:1px solid rgba(183,138,75,.4)}.empty{color:var(--muted);font-style:italic}.seal{position:absolute;right:44px;top:62px;widt background:var(--paper)}.index th,.index td{padding:8px 10px;border-bottom:1px solid #ded4c4;text-align:left}.index th{color:var(--muted);font-size:11px;font-weight:400}.empty{color:var(--muted);font-style:italic}.status{font-size:11px;color:#e7d7bf;margin-left:10px}.footer-note{font-size:11px;color:var(--muted);line-height:1.6}.group-toggle{width:100%;border:0;background:transparent;text-align:left;padding:0;color:#5c4d3c;font-weight:500;display:flex;justify-content:space-between}.group-toggle::after{content:'⌄';color:var(--muted)}.group-body{margin-top:8px}.hidden{display:none!important}
@media(max-width:1180px){.workspace{grid-template-columns:250px minmax(420px,1fr) 320px}}@media(max-width:980px){.workspace{grid-template-columns:235px minmax(420px,1fr)}.inspector{display:none}}@media(max-width:760px){.workspace{grid-template-columns:1fr}.sidebar{display:none}.canvas{padding:12px}.page,.cover-page{min-height:780px;padding:56px 35px 50px;width:100%}.top-tabs{display:none}.topbar{padding:0 12px}.page{max-width:100%}}

</head>
<body>
<div class="app" id="app"><header class="topbar"><div class="brand">岐伯论<small>编册设计台 · 初版</small></div><nav class="top-tabs"><button class="tab active" data-tab="article">单篇设计</button><button class="tab" data-tab="cover">封面设计</button><button class="tab" data-tab="page">页面设置</button><button class="tab" data-tab="style">样式系统</button><button class="tab" data-tab="master">母版页</button><button class="tab" data-tab="asset">资产</button><button class="tab" data-tab="volume">分册平衡</button><button class="tab" data-tab="index">目录索引</button><button class="tab" data-tab="preflight">预检</button></nav><span class="status" id="data-status">正在加载数据</span><div class="top-actions"><button class="btn" id="save-btn">保存方案</button><button class="btn primary" id="export-btn">导出配置</button></div></header><main class="workspace"><aside class="sidebar" id="sidebar"></aside><section class="canvas" id="canvas"></section><aside class="inspector" id="inspector"></aside></main></div>
<script>
const state={tab:'article',sampleOrdinal:4044,orientation:'horizontal',preset:'古籍研究本',meta:null,topics:null,articles:null,samples:null,plan:null,bodies:{},schemeName:'古籍研究本-横排-批注优先',styles:{body:{font:'Noto Serif CJK SC',size:16,leading:1.9,indent:2,gap:14},title:{font:'Noto Serif CJK SC',size:31,align:'left'},question:{font:'Noto Serif CJK SC',size:18,style:'line'},meta:{font:'Noto Sans CJK SC',size:10,display:true}},masters:{body:{header:true,folio:true,frame:true,notes:4},chapter:{header:true,folio:true,frame:true,notes:2},appendix:{header:true,folio:true,frame:false,notes:1}},tokens:{paper:'A5',pageW:148,pageH:210,marginTop:20,marginBottom:22,marginInner:23,marginOuter:28,gutter:4,bodyFont:'Noto Serif CJK SC',headingFont:'Noto Serif CJK SC',bodySize:16,leading:1.9,paraIndent:2,paraGap:14,bodyAlign:'left',titleSize:31,titleAlign:'left',questionSize:18,questionStyle:'line',metaSize:10,showMeta:true,imageWidth:88,imageGap:18,imageBorder:1,noteMode:'after',noteLines:3,notePages:4,showSeal:true,showFrame:true,coverPalette:'indigo',coverTitleVertical:true,showHeader:true,showFolio:true,showCoverMeta:true,sealText:'岐伯\n论',sealFont:'KaiTi',sealSize:21,sealX:78,sealY:10,sealRotate:5,sealColor:'#a74736',fontInventory:[]}};
const presets={
 '古籍研究本':{paper:'A5',pageW:148,pageH:210,marginTop:20,marginBottom:22,marginInner:23,marginOuter:28,gutter:4,bodyFont:'Noto Serif CJK SC',headingFont:'Noto Serif CJK SC',bodySize:16,leading:1.9,paraIndent:2,paraGap:14,bodyAlign:'left',titleSize:31,titleAlign:'left',questionSize:18,questionStyle:'line',metaSize:10,showMeta:true,imageWidth:88,imageGap:18,imageBorder:1,noteMode:'after',noteLines:3,notePages:4,showSeal:true,showFrame:true,coverPalette:'indigo',coverTitleVertical:true,showHeader:true,showFolio:true,showCoverMeta:true},
 '素本研究本':{paper:'B5',pageW:176,pageH:250,marginTop:20,marginBottom:22,marginInner:24,marginOuter:32,gutter:5,bodyFont:'Noto Serif CJK SC',headingFont:'Noto Serif CJK SC',bodySize:16,leading:2,paraIndent:2,paraGap:16,bodyAlign:'left',titleSize:29,titleAlign:'left',questionSize:17,questionStyle:'plain',metaSize:9,showMeta:true,imageWidth:82,imageGap:22,imageBorder:0,noteMode:'after',noteLines:4,notePages:6,showSeal:false,showFrame:false,coverPalette:'plain',coverTitleVertical:true,showHeader:false,showFolio:true,showCoverMeta:true},
 '档案本':{paper:'A4',pageW:210,pageH:297,marginTop:16,marginBottom:18,marginInner:20,marginOuter:20,gutter:3,bodyFont:'Noto Sans CJK SC',headingFont:'Noto Sans CJK SC',bodySize:14,leading:1.65,paraIndent:0,paraGap:9,bodyAlign:'left',titleSize:25,titleAlign:'left',questionSize:15,questionStyle:'frame',metaSize:9,showMeta:true,imageWidth:90,imageGap:12,imageBorder:1,noteMode:'none',noteLines:0,notePages:1,showSeal:false,showFrame:false,coverPalette:'ochre',coverTitleVertical:false,showHeader:true,showFolio:true,showCoverMeta:true}}
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmToPx=mm=>Math.round(mm*3.78); const fontStacks={"Noto Serif CJK SC":"\"Noto Serif CJK SC\",\"Source Han Serif SC\",\"Songti SC\",serif","Noto Sans CJK SC":"\"Noto Sans CJK SC\",\"Source Han Sans SC\",sans-serif","Songti SC":"\"Songti SC\",\"STSong\",serif","KaiTi":"\"KaiTi\",\"STKaiti\",serif","serif":"serif","sans-serif":"sans-serif"};
async function load(){try{state.meta=await (await fetch('data/manifest.json')).json();state.topics=await (await fetch('data/topics.json')).json();state.articles=await (await fetch('data/article-meta.json')).json();state.samples=await (await fetch('data/samples.json')).json();state.plan=await (await fetch('data/plan-baseline.json')).json();$('#data-status').textContent=`数据 ${state.articles.length} 篇`;render()}catch(e){$('#data-status').textContent='请通过本地 HTTP 服务打开';$('#canvas').innerHTML='<div class="page"><h1>数据未加载</h1><p>请在 design-studio 目录启动本地 HTTP 服务后访问。</p></div>'}}
function selected(){return state.articles.find(x=>x.ordinal===state.sampleOrdinal)||state.articles[0]}
function getBody(a){return state.bodies[a.primaryTopic]?.find(x=>x.ordinal===a.ordinal)||state.samples.find(x=>x.ordinal===a.ordinal)||null}
async function bodyFor(a){if(!state.bodies[a.primaryTopic]){try{state.bodies[a.primaryTopic]=await (await fetch(`data/bodies-${a.primaryTopic}.json`)).json()}catch(e){state.bodies[a.primaryTopic]=[]}}return getBody(a)}
function applyVars(){let t=state.tokens;document.documentElement.style.setProperty('--paper-color',t.paper==='custom'?t.paperColor:(t.paper==='A4'?'#fbf8f0':'#f8f3e8'));document.documentElement.style.setProperty('--page-width',mmToPx(t.pageW)+'px');document.documentElement.style.setProperty('--page-height',mmToPx(t.pageH)+'px');document.documentElement.style.setProperty('--margin-top',mmToPx(t.marginTop)+'px');document.documentElement.style.setProperty('--margin-bottom',mmToPx(t.marginBottom)+'px');document.documentElement.style.setProperty('--margin-inner',mmToPx(t.marginInner+t.gutter)+'px');document.documentElement.style.setProperty('--margin-outer',mmToPx(t.marginOuter)+'px');document.documentElement.style.setProperty('--body-font',fontStacks[t.bodyFont]||fontStacks.serif);document.documentElement.style.setProperty('--heading-font',fontStacks[t.headingFont]||fontStacks.serif);document.documentElement.style.setProperty('--body-size',t.bodySize+'px');document.documentElement.style.setProperty('--leading',t.leading);document.documentElement.style.setProperty('--para-indent',t.paraIndent+'em');document.documentElement.style.setProperty('--para-gap',t.paraGap+'px');document.documentElement.style.setProperty('--body-align',t.bodyAlign);document.documentElement.style.setProperty('--title-size',t.titleSize+'px');document.documentElement.style.setProperty('--question-size',t.questionSize+'px');document.documentElement.style.setProperty('--meta-size',t.metaSize+'px');document.documentElement.style.setProperty('--image-width',t.imageWidth+'%');document.documentElement.style.setProperty('--image-gap',t.imageGap+'px');document.documentElement.style.setProperty('--image-border',t.imageBorder+'px');document.documentElement.style.setProperty('--meta-display',t.showMeta?'block':'none');document.documentElement.style.setProperty('--notes-display',t.noteMode==='none'?'none':'block');document.documentElement.style.setProperty('--indigo',t.coverPalette==='ochre'?'#76512c':'#254458');document.documentElement.style.setProperty('--indigo-deep',t.coverPalette==='ochre'?'#493420':'#183243');document.documentElement.style.setProperty('--paper',t.paperColor||'#f8f3e8')}
function render(){applyVars();renderSidebar();renderInspector();if(state.tab==='article')renderArticle();if(state.tab==='cover')renderCoverStudio();if(state.tab==='page')renderPageStudio();if(state.tab==='style')renderStyleStudio();if(state.tab==='master')renderMasterStudio();if(state.tab==='asset')renderAssetStudio();if(state.tab==='volume')renderVolumes();if(state.tab==='index')renderIndex();if(state.tab==='preflight')renderPreflight();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab))}
function renderSidebar(){if(state.tab==='article'){let a=selected();$('#sidebar').innerHTML=`<div class="block"><h3 class="section-title">视觉预设</h3><div class="preset-grid">${Object.keys(presets).map(p=>`<button class="preset ${state.preset===p?'active':''}" data-preset="${p}">${p}</button>`).join('')}</div></div><div class="block"><h3 class="section-title">样篇</h3><input class="field" id="search" type="text" placeholder="搜索标题或源序号"><div class="sample-list" id="sample-list"></div></div><div class="block"><h3 class="section-title">当前文章</h3><div class="footer-note">${a.ordinal} · ${esc(a.title)}<br>${esc(a.primaryName)}<br>${a.bodyChars.toLocaleString()} 字 · ${a.availableImageCount} 张可用图</div></div>`;fillSamples();document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{state.preset=b.dataset.preset;Object.assign(state.tokens,presets[state.preset]);render()});$('#search').oninput=fillSamples()}else if(state.tab==='volume'){$('#sidebar').innerHTML=`<div class="block"><h3 class="section-title">当前生产基线</h3><div class="stats"><div class="stat"><b>${state.plan.total_articles_printed}</b><span>入册文章</span></div><div class="stat"><b>${state.plan.volumes}</b><span>分册文件</span></div></div></div><div class="block"><h3 class="section-title">平衡提示</h3><p class="footer-note">下一版加入综合页数、图片、批注空间、文章密度和纸张折页约束。</p></div></div>`}else{$('#sidebar').innerHTML=`<div class="block"><h3 class="section-title">索引类型</h3><p class="footer-note">总目录、分册目录、源序号、标题、日期、专题和研究交叉索引。</p></div><div class="block"><h3 class="section-title">数据状态</h3><p class="footer-note">索引基于 ${state.articles.length} 篇元数据生成，页码暂为“待回填”。</p></div>`}}
function bindControls(){document.querySelectorAll('[data-key]').forEach(el=>{el.oninput=()=>{let k=el.dataset.key;let v=el.value;if(k==='paper'){state.tokens.paper=v;if(v==='A5'){state.tokens.pageW=148;state.tokens.pageH=210}if(v==='B5'){state.tokens.pageW=176;state.tokens.pageH=250}if(v==='A4'){state.tokens.pageW=210;state.tokens.pageH=297}}else if(['pageW','pageH','marginTop','marginBottom','marginInner','marginOuter','gutter'].includes(k)){state.tokens[k]=Number(v)}else{state.tokens[k]=v}render()}})}

function control(key,label,type='range',opts={}){let t=state.tokens,v=t[key],output=type==='range'?`<output>${opts.format?opts.format(v):v}</output>`:'';if(type==='select'){return `<div class="field"><label>${label}</label><select data-key="${key}">${opts.options.map(o=>`<option value="${o[0]}" ${String(v)===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}if(type==='text'){return `<div class="field"><label>${label}</label><input data-key="${key}" type="text" value="${esc(v||'')}"></div>`}if(type==='number'){return `<div class="field"><label>${label}</label><input data-key="${key}" type="number" value="${v}" min="${opts.min||0}" max="${opts.max||999}" step="${opts.step||1}"></div>`}if(type==='color'){return `<div class="field"><label>${label}</label><input data-key="${key}" type="color" value="${v}"></div>`}return `<div class="field"><label>${label}${output}</label><input data-key="${key}" type="range" min="${opts.min}" max="${opts.max}" step="${opts.step||1}" value="${v}"></div>`}

function renderInspector(){if(state.tab!=='article'){return renderNonArticleInspector()}let t=state.tokens;let page=group('页面与装订',control('paper','开本','select',{options:[['A5','A5 · 148 × 210 mm'],['B5','B5 · 176 × 250 mm'],['A4','A4 · 210 × 297 mm'],['custom','自定义尺寸']]} )+(t.paper==='custom'?`<div class="field-row">${control('pageW','页面宽度','number',{min:80,max:400})}${control('pageH','页面高度','number',{min:80,max:450})}</div>`:'')+`<div class="field-row">${control('marginTop','上边距','number',{min:5,max:60})}${control('marginBottom','下边距','number',{min:5,max:60})}</div><div class="field-row">${control('marginInner','内侧装订边','number',{min:5,max:70})}${control('marginOuter','外侧批注边','number',{min:5,max:90})}</div>${control('gutter','装订增量','number',{min:0,max:30})}`,true);

async function readSystemFonts(){let box=$('#font-status');if(!('queryLocalFonts' in window)){box.textContent='当前浏览器不支持 Font Access API；请在字体字段手工输入字体名，预览会按浏览器可用字体回退。';return}try{let list=await window.queryLocalFonts();state.tokens.fontInventory=list.map(x=>x.family).filter((x,i,a)=>a.indexOf(x)===i).sort();box.textContent='已读取 '+state.tokens.fontInventory.length+' 个系统字体：'+state.tokens.fontInventory.slice(0,8).join('、')+(state.tokens.fontInventory.length>8?'……':'')}catch(e){box.textContent='字体读取需要用户授权或安全上下文；当前未获得授权。'}}

async function renderArticle(){let a=selected();let b=await bodyFor(a)||{};let paras=(b.body||'').split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');let imgs=(a.images||[]).map(x=>`<figure><img src="../../${esc(x.src)}" alt="${esc(a.title)} 图片"><figcaption>图 ${x.index}</figcaption></figure>`).join('');let cls=state.orientation==='vertical'?'vertical':'';let questionStyle=state.tokens.questionStyle==='plain'?'plain':state.tokens.questionStyle==='frame'?'frame':'';let isArchive=a.archive;$('#canvas').innerHTML=`<div class="canvas-head"><strong>${state.orientation==='vertical'?'竖排试验':'横排研究工作本'} · ${String(a.ordinal).padStart(4,'0')} · ${state.tokens.paper}</strong><span>${esc(a.primaryName)} · ${state.tokens.pageW}×${state.tokens.pageH} mm</span></div><div class="${isArchive?'cover-page '+(state.tokens.coverPalette==='ochre'?'ochre':state.tokens.coverPalette==='plain'?'plain':''): 'page '+cls}">${isArchive?`<div class="cover-title" style="writing-mode:${state.tokens.coverTitleVertical?'vertical-rl':'horizontal-tb'}">岐伯论</div><div class="cover-slip">档案册<br>${esc(a.title)}</div>${state.tokens.showSeal?'<div class="cover-seal">岐伯<br>论</div>':''}<div class="cover-meta" style="display:${state.tokens.showCoverMeta?'block':'none'}">附录文章 · ${a.archiveReason||'档案保留'}</div>`:`${state.tokens.showHeader?`<div class="folio"><span>${esc(a.primaryName)}</span><span>${state.tokens.showFolio?String(a.ordinal).padStart(4,'0'):''}</span></div>`:''}${state.tokens.showSeal?'<div class="seal">岐伯<br>论</div>':''}<h1 class="article-title">${String(a.ordinal).padStart(4,'0')}　${esc(a.title)}</h1><div class="article-date">${esc(a.date||'日期未知')}</div><div class="label">提问</div><div class="question ${questionStyle}">${esc(b.question||'原始提问缺失')}</div><div class="label">正文</div><section class="article-body">${paras||'<p class="empty">（正文为空或仅由图片承载。）</p>'}</section>${imgs?`<section class="images"><div class="label">图片</div>${imgs}</section>`:''}<section class="research-meta">原文来源：见索引，源序号 ${a.ordinal}<br>主专题：${esc(a.primaryName)}<br>副专题：${esc((a.secondaryNames||[]).join('；')||'无')}<br>状态：${esc(a.classificationStatus)} · ${esc(a.readingStatus)}</section><section class="notes" style="display:${state.tokens.noteMode==='none'?'none':'block'}"><div>研究笔记</div>${Array.from({length:state.tokens.noteLines},()=>'<div class="note-line"></div>').join('')}</section>`}</div>`}
function renderVolumes(){let vols=state.plan.topic_volumes||[];$('#canvas').innerHTML=`<div class="canvas-head"><strong>32 册生产基线</strong><span>增强版统计视图</span></div><div class="page" style="font-family:var(--ui-font);padding:44px;min-height:700px"><h1 class="article-title">分册厚度与内容分布</h1><p>后续平衡器将把页数、图片、批注空间、文章密度和纸张折页约束纳入同一模型。</p><div class="volume-list">${vols.map(v=>`<div class="volume-card"><header><span>${v.topic_code} · ${v.topic_name} · 第 ${v.volume}/${v.volumes_total} 册</span><span>${v.est_pages} 页</span></header><div class="bar"><i style="width:${Math.min(100,v.est_pages/2)}%"></i></div><small>${v.articles} 篇 · ${v.body_chars.toLocaleString()} 字</small></div>`).join('')}</div></div>`}
function renderIndex(){let topics=state.topics||[];$('#canvas').innerHTML=`<div class="index"><h2>目录与索引初版</h2><p>页码暂为“待回填”。点击文章可回到单篇设计。</p><table><thead><tr><th>编码</th><th>专题</th><th>文章数</th><th>预计册数</th><th>状态</th></tr></thead><tbody>${topics.map(t=>{let n=state.articles.filter(a=>a.primaryTopic===t.code).length;return `<tr><td>${t.code}</td><td>${esc(t.name)}</td><td>${n}</td><td>${state.plan.topic_volumes.filter(v=>v.topic_code===t.code).length||'附录'}</td><td>待回填页码</td></tr>`}).join('')}</tbody></table></div>`}
function indexMarkdown(){return '# 岐伯论阅读正文版目录索引初稿\n\n页码：待回填\n\n'+state.topics.map(t=>{let n=state.articles.filter(a=>a.primaryTopic===t.code).length;return `- ${t.code} ${t.name}：${n} 篇`}).join('\n')}
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#save-btn').onclick=()=>{let key='qbl-design-'+Date.now();localStorage.setItem(key,JSON.stringify({name:state.schemeName,createdAt:new Date().toISOString(),tokens:state.tokens,orientation:state.orientation,preset:state.preset}));$('#data-status').textContent='方案已保存'};
$('#export-btn').onclick=()=>download('design-config.json',JSON.stringify({version:1,generatedAt:new Date().toISOString(),dataSha256:state.meta?.corpusSha256,schemeName:state.schemeName,theme:state.tokens,orientation:state.orientation,plan:'baseline',index:{pagePlaceholder:'待回填'},output:{paper:state.tokens.paper,pageW:state.tokens.pageW,pageH:state.tokens.pageH,duplex:true}},null,2));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});load();
</script>
</body></html>
